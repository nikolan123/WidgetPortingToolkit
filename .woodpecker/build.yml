when:
  - event: push
    branch:
      - main
      - master
  - event: manual

labels:
  backend: local
  platform: darwin/amd64

steps:
  build-macos:
    image: bash
    commands:
      - date +%s > .tekljer_action_started_at
      - xcodebuild -version
      - command -v create-dmg
      - |
        xcodebuild \
          -project "WidgetPortingAPP.xcodeproj" \
          -scheme "WidgetPlayerTemplate" \
          -configuration Release \
          -destination "platform=macOS" \
          ARCHS="arm64 x86_64" \
          ONLY_ACTIVE_ARCH=NO \
          BUILD_DIR=build \
          clean build
      - |
        xcodebuild \
          -project "WidgetPortingAPP.xcodeproj" \
          -scheme "Widget Porting Toolkit" \
          -configuration Release \
          -destination "platform=macOS" \
          ARCHS="arm64 x86_64" \
          ONLY_ACTIVE_ARCH=NO \
          BUILD_DIR=build \
          build
      - |
        (
          cd build/Release
          mkdir -p "Widget Porting Toolkit.app/Contents/Resources/Templates"
          rm -rf "Widget Porting Toolkit.app/Contents/Resources/Templates/WidgetPlayerTemplate.app"
          ditto "WidgetPlayerTemplate.app" "Widget Porting Toolkit.app/Contents/Resources/Templates/WidgetPlayerTemplate.app"
          xattr -cr "Widget Porting Toolkit.app"
          codesign --force --deep --sign - "Widget Porting Toolkit.app"
        )
      - mkdir -p artifacts
      - |
        create-dmg \
          --volname "Widget Porting Toolkit" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 128 \
          --icon "Widget Porting Toolkit.app" 150 200 \
          --hide-extension "Widget Porting Toolkit.app" \
          --app-drop-link 450 200 \
          --background ".github/assets/dmg-background.png" \
          "artifacts/Widget Porting Toolkit.dmg" \
          "build/Release/Widget Porting Toolkit.app"
      - |
        (
          cd build/Release
          zip -r "../../artifacts/Widget Porting Toolkit.zip" "Widget Porting Toolkit.app"
        )
      - |
        DMG_HASH="$(shasum -a 256 "artifacts/Widget Porting Toolkit.dmg" | awk '{print $1}')"
        ZIP_HASH="$(shasum -a 256 "artifacts/Widget Porting Toolkit.zip" | awk '{print $1}')"
        {
          echo "DMG_SHA256=$DMG_HASH"
          echo "ZIP_SHA256=$ZIP_HASH"
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } > artifacts/build-info.txt
      - ls -lah artifacts

  post-to-main-pc:
    image: bash
    depends_on:
      - build-macos
    environment:
      UPLOAD_TOKEN:
        from_secret: upload_token
      TEKLJER_SERVER: http://192.168.1.20:7777
      TEKLJER_JOB: macos-release
    commands:
      - command -v curl
      - command -v jq
      - curl -fsSL "$TEKLJER_SERVER/ci/v1/upload.sh" | sh
